name: Update Match Results

on:
  schedule:
    # 大会期間中（6-7月）は2時間ごと
    - cron: '0 */2 * 6,7 *'
    # 通年 毎日1回（親善試合・日程更新用 / UTC 03:00）
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch WC2026 + friendlies (TheSportsDB) → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cat << 'SCRIPT' > update.mjs
          /**
           * FIFA W杯2026 結果＋親善試合を TheSportsDB(無料・公開API) から取得し Supabase へ。
           * 無料tierは一度に少数の試合しか返さないため、複数エンドポイントを統合し、
           * 既存の試合結果を「累積」して一度取得した結果は失わない設計。
           * 必要 Secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY(service_role)
           */
          const URL = process.env.SUPABASE_URL;
          const KEY = process.env.SUPABASE_SERVICE_KEY;
          const L = 4429, S = 2026;
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const J = async (u, o) => { try { const r = await fetch(u, o); return await r.json(); } catch (e) { return {}; } };

          const NM = {'Mexico':'メキシコ','South Africa':'南アフリカ','South Korea':'韓国','Korea Republic':'韓国','Czech Republic':'チェコ','Czechia':'チェコ','Canada':'カナダ','Bosnia and Herzegovina':'ボスニア','Bosnia-Herzegovina':'ボスニア','Qatar':'カタール','Switzerland':'スイス','Brazil':'ブラジル','Morocco':'モロッコ','Haiti':'ハイチ','Scotland':'スコットランド','United States':'アメリカ','USA':'アメリカ','Paraguay':'パラグアイ','Australia':'オーストラリア','Turkey':'トルコ','Turkiye':'トルコ','Germany':'ドイツ','Curacao':'キュラソー','Curaçao':'キュラソー','Ivory Coast':'コートジボワール','Ecuador':'エクアドル','Netherlands':'オランダ','Japan':'日本','Sweden':'スウェーデン','Tunisia':'チュニジア','Belgium':'ベルギー','Egypt':'エジプト','Iran':'イラン','New Zealand':'ニュージーランド','Spain':'スペイン','Cape Verde':'カーボベルデ','Saudi Arabia':'サウジアラビア','Uruguay':'ウルグアイ','France':'フランス','Senegal':'セネガル','Iraq':'イラク','Norway':'ノルウェー','Argentina':'アルゼンチン','Algeria':'アルジェリア','Austria':'オーストリア','Jordan':'ヨルダン','Portugal':'ポルトガル','DR Congo':'DRコンゴ','Congo DR':'DRコンゴ','Uzbekistan':'ウズベキスタン','Colombia':'コロンビア','England':'イングランド','Croatia':'クロアチア','Ghana':'ガーナ','Panama':'パナマ'};
          const ja = (n) => NM[n] || n;
          const GRP = {A:["メキシコ","南アフリカ","韓国","チェコ"],B:["カナダ","ボスニア","カタール","スイス"],C:["ブラジル","モロッコ","ハイチ","スコットランド"],D:["アメリカ","パラグアイ","オーストラリア","トルコ"],E:["ドイツ","キュラソー","コートジボワール","エクアドル"],F:["オランダ","日本","スウェーデン","チュニジア"],G:["ベルギー","エジプト","イラン","ニュージーランド"],H:["スペイン","カーボベルデ","サウジアラビア","ウルグアイ"],I:["フランス","セネガル","イラク","ノルウェー"],J:["アルゼンチン","アルジェリア","オーストリア","ヨルダン"],K:["ポルトガル","DRコンゴ","ウズベキスタン","コロンビア"],L:["イングランド","クロアチア","ガーナ","パナマ"]};
          const TG = {}; Object.entries(GRP).forEach(([g,ts]) => ts.forEach(t => TG[t]=g));
          const FIFA_RANK = {"フランス":1,"スペイン":2,"アルゼンチン":3,"イングランド":4,"ポルトガル":5,"ブラジル":6,"オランダ":7,"モロッコ":8,"ベルギー":9,"ドイツ":10,"クロアチア":11,"コロンビア":13,"セネガル":14,"メキシコ":15,"アメリカ":16,"ウルグアイ":17,"日本":18,"スイス":19,"イラン":21,"トルコ":22,"エクアドル":23,"オーストリア":24,"韓国":25,"オーストラリア":27,"アルジェリア":28,"エジプト":29,"カナダ":30,"ノルウェー":32,"パナマ":33,"コートジボワール":34,"スウェーデン":38,"パラグアイ":40,"チェコ":41,"スコットランド":43,"チュニジア":44,"DRコンゴ":46,"ウズベキスタン":50,"カタール":55,"イラク":57,"南アフリカ":60,"サウジアラビア":61,"ヨルダン":63,"ボスニア":65,"カーボベルデ":69,"ガーナ":74,"キュラソー":82,"ハイチ":83,"ニュージーランド":85};
          const SDB = {"メキシコ":"134497","南アフリカ":"136482","韓国":"134517","チェコ":"133904","カナダ":"140073","ボスニア":"149845","カタール":"136472","スイス":"134506","ブラジル":"134496","モロッコ":"136139","ハイチ":"140175","スコットランド":"136450","アメリカ":"134514","パラグアイ":"136471","オーストラリア":"134500","トルコ":"135985","ドイツ":"133907","キュラソー":"140271","コートジボワール":"134502","エクアドル":"134507","オランダ":"133905","日本":"134503","スウェーデン":"133916","チュニジア":"136142","ベルギー":"134515","エジプト":"136138","イラン":"134511","ニュージーランド":"137449","スペイン":"133909","カーボベルデ":"136477","サウジアラビア":"136137","ウルグアイ":"134504","フランス":"133913","セネガル":"136143","イラク":"140148","ノルウェー":"136516","アルゼンチン":"134509","アルジェリア":"134516","オーストリア":"135986","ヨルダン":"140145","ポルトガル":"133908","DRコンゴ":"136475","ウズベキスタン":"140151","コロンビア":"134501","イングランド":"133914","クロアチア":"133912","ガーナ":"134513","パナマ":"136141"};

          async function patch(data) {
            const res = await fetch(`${URL}/rest/v1/tournament?id=eq.wc2026`, { method:'PATCH', headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=minimal'}, body: JSON.stringify(data) });
            if (!res.ok) throw new Error('Supabase ' + res.status + ': ' + (await res.text()).slice(0,200));
          }

          async function main() {
            if (!URL || !KEY) { console.log('Secrets未設定, skip'); return; }

            // 既存の試合（累積のベース）
            let prev = [];
            try { const d = await J(`${URL}/rest/v1/tournament?id=eq.wc2026&select=ko`, {headers:{apikey:KEY,Authorization:'Bearer '+KEY}}); prev = (d[0] && d[0].ko && d[0].ko.matches) || []; } catch (e) {}

            // 複数エンドポイントから収集（無料tierの断片化対策）
            const eps = [`/eventsseason.php?id=${L}&s=${S}`, `/eventspastleague.php?id=${L}`, `/eventsnextleague.php?id=${L}`];
            for (let r = 1; r <= 8; r++) eps.push(`/eventsround.php?id=${L}&r=${r}&s=${S}`);
            let raw = [];
            for (const ep of eps) { const d = await J('https://www.thesportsdb.com/api/v1/json/3' + ep); (d.events || []).forEach(e => raw.push(e)); await sleep(1000); }

            // マージ（key=home|away、スコア有を優先、既存prevを保持して結果を失わない）
            const map = {};
            // 既存が手動修正(manual)ならAPIで上書きしない。スコア無し→有りのみ置換。id/tsは補完
            const put = (m) => { const k = m.home+'|'+m.away; const ex = map[k]; const has = m.hs!=null&&m.as!=null; if (!ex) { map[k]=m; return; } if (ex.manual) { if (m.id&&!ex.id) ex.id=m.id; if (m.ts&&!ex.ts) ex.ts=m.ts; return; } const eh = ex.hs!=null&&ex.as!=null; if (has&&!eh) map[k]=m; else { if (m.id&&!ex.id) ex.id=m.id; if (m.ts&&!ex.ts) ex.ts=m.ts; } };
            prev.forEach(put);
            raw.forEach(e => { const m = {date:e.dateEvent||'',ts:e.strTimestamp||'',home:ja(e.strHomeTeam||''),away:ja(e.strAwayTeam||''),hs:(e.intHomeScore==null||e.intHomeScore==='')?null:Number(e.intHomeScore),as:(e.intAwayScore==null||e.intAwayScore==='')?null:Number(e.intAwayScore),round:Number(e.intRound||0),status:e.strStatus||'',id:e.idEvent||''}; if (m.home&&m.away) put(m); });
            const matches = Object.values(map).sort((a,b) => (a.date||'').localeCompare(b.date||''));

            // 星取表（round<=3 の終了試合）＋ フェアプレー
            const groups = {}; Object.keys(GRP).forEach(g => groups[g] = GRP[g].map(n => ({n,mp:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,yc:0,rc:0,fp:0})));
            const find = (g,n) => groups[g].find(t => t.n===n);
            matches.forEach(m => { if ((m.round&&m.round>3)||m.hs==null||m.as==null) return; const g=TG[m.home]; if (!g||TG[m.away]!==g) return; const H=find(g,m.home),A=find(g,m.away); if (!H||!A) return; H.mp++;A.mp++;H.gf+=m.hs;H.ga+=m.as;A.gf+=m.as;A.ga+=m.hs; if (m.hs>m.as){H.w++;A.l++;H.pts+=3;} else if (m.hs<m.as){A.w++;H.l++;A.pts+=3;} else {H.d++;A.d++;H.pts++;A.pts++;} });
            // フェアプレー: timelineのカードを「試合ごと」m.cardsに保持。既にあれば再取得しない（累積/節約）
            for (const m of matches) {
              if (m.hs==null||m.as==null||!m.id||m.cards) continue;
              const tl = await J(`https://www.thesportsdb.com/api/v1/json/3/lookuptimeline.php?id=${m.id}`);
              let hy=0,hr=0,ay=0,ar=0;
              (tl.timeline||[]).forEach(x => { const det=(x.strTimelineDetail||'').toLowerCase(); if(!det.includes('card'))return; const tm=ja(x.strTeam||''); const red=det.includes('red'); if(tm===m.home){if(red)hr++;else hy++;} else if(tm===m.away){if(red)ar++;else ay++;} });
              m.cards={hy,hr,ay,ar};
              await sleep(500);
            }
            matches.forEach(m => { if((m.round&&m.round>3)||m.hs==null||m.as==null||!m.cards) return; const g=TG[m.home]; if(!g||TG[m.away]!==g) return; const H=find(g,m.home),A=find(g,m.away); if(!H||!A) return; H.yc+=m.cards.hy||0;H.rc+=m.cards.hr||0;A.yc+=m.cards.ay||0;A.rc+=m.cards.ar||0; });
            Object.keys(groups).forEach(g => groups[g].forEach(t => { t.fp = -(t.yc*1 + t.rc*4); }));
            Object.keys(groups).forEach(g => groups[g].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||b.fp-a.fp||(FIFA_RANK[a.n]||999)-(FIFA_RANK[b.n]||999)));
            const played = matches.some(m => (!m.round||m.round<=3) && m.hs!=null);

            // ノックアウト（round>=4 の終了試合の勝者）ベストエフォート
            const ko = {r32:[],r16:[],qf:[],sf:[],final:[],champ:null,third:null,matches};
            const STG = {4:'r32',5:'r16',6:'qf',7:'sf',8:'final'};
            matches.forEach(m => { if (!m.round||m.round<4||m.hs==null||m.as==null) return; const st=STG[m.round]; if (!st) return; const w=m.hs>m.as?m.home:m.as>m.hs?m.away:null; if (!w) return; if (st==='final'){ if(!ko.final.includes(m.home))ko.final.push(m.home); if(!ko.final.includes(m.away))ko.final.push(m.away); ko.champ=w; } else if (!ko[st].includes(w)) ko[st].push(w); });
            let phase = 'pre';
            if (ko.champ) phase='done'; else if (ko.final.length) phase='final'; else if (ko.sf.length) phase='sf'; else if (ko.qf.length) phase='qf'; else if (ko.r16.length) phase='r16'; else if (ko.r32.length) phase='r32'; else if (played) phase='groups';

            await patch({ phase, groups: played ? groups : {}, ko, last_api_update: new Date().toISOString() });
            console.log('WC: prev', prev.length, 'merged', matches.length, 'finished', matches.filter(m=>m.hs!=null).length, 'phase', phase);

            // 親善試合（出場国の直近1試合、重複対策込み）
            const fr = []; const seen = new Set(); const seenM = new Set();
            for (const [jaName, id] of Object.entries(SDB)) {
              const d = await J(`https://www.thesportsdb.com/api/v1/json/3/eventslast.php?id=${id}`);
              const ev = (d.results || [])[0];
              if (ev) {
                const home = ja(ev.strHomeTeam||''), away = ja(ev.strAwayTeam||'');
                const mk = home+'|'+away+'|'+(ev.dateEvent||'');
                if ((home===jaName||away===jaName) && !seen.has(ev.idEvent) && !seenM.has(mk)) {
                  seen.add(ev.idEvent); seenM.add(mk);
                  fr.push({ date:ev.dateEvent||'', home, away, hs:ev.intHomeScore==null?null:Number(ev.intHomeScore), as:ev.intAwayScore==null?null:Number(ev.intAwayScore), league:ev.strLeague||'' });
                }
              }
              await sleep(2600);
            }
            fr.sort((a,b) => (b.date||'').localeCompare(a.date||''));
            try { await patch({ friendlies: fr.slice(0,24) }); console.log('friendlies', fr.length); } catch (e) { console.warn('friendlies fail:', e.message); }
          }
          main().catch((e) => { console.error('❌', e); process.exit(1); });
          SCRIPT
          node update.mjs
